name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend-heavy/requirements.txt || pip install fastapi pydantic numpy
      - run: python -c "from backend-heavy.fusionuncertaintynet.model import FusionUncertaintyNet; m=FusionUncertaintyNet(); print('model ok', sum(p.numel() for p in m.parameters()))"
      - run: pytest -q || echo "no tests yet"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: cd frontend && npm ci || npm install
      - run: cd frontend && npm run build
