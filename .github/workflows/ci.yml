name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-heavy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r backend-heavy/requirements.txt || pip install fastapi pydantic numpy scikit-learn
      - run: PYTHONPATH=backend-heavy:$PYTHONPATH python -c "from fusionuncertaintynet.model import FusionUncertaintyNet; m=FusionUncertaintyNet(); print('model ok', sum(p.numel() for p in m.parameters()))"
      - run: PYTHONPATH=backend-heavy:$PYTHONPATH pytest -q || echo "no tests yet"

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123:web:abc"
      NEXT_PUBLIC_LITE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: cd frontend && npm ci || npm install --legacy-peer-deps
      - run: cd frontend && npm run build
